<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>DRONE ARMOURY</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#000;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;font-family:'Rajdhani',sans-serif;overflow:hidden;
}

/* ── 16:9 screen ─────────────────────────────────────────────── */
.screen{
  position:relative;
  width:min(100vw,calc(100vh*16/9));
  height:min(100vh,calc(100vw*9/16));
  background:#0d0f15;
  display:grid;
  grid-template-rows:8% 72% 20%;
  overflow:hidden;
}

/* subtle noise grain */
.screen::after{
  content:'';position:absolute;inset:0;z-index:200;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  background-size:200px 200px;pointer-events:none;opacity:.5;
}

/* ── HEADER ──────────────────────────────────────────────────── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.5%;
  background:linear-gradient(180deg,#191c26 0%,#13151f 100%);
  border-bottom:1px solid rgba(255,255,255,.07);
  z-index:10;position:relative;
}
.hdr-brand{
  display:flex;align-items:center;gap:.8%;
  font-family:'Orbitron',sans-serif;
}
.hdr-icon{
  width:2.2em;height:2.2em;
  background:rgba(192,37,42,.15);border:1px solid rgba(192,37,42,.4);
  border-radius:3px;display:flex;align-items:center;justify-content:center;
  color:#c0252a;font-size:.9em;font-weight:900;
}
.hdr-title{color:#e8eaf0;font-size:.9em;font-weight:700;letter-spacing:.25em;}
.hdr-sep{color:rgba(255,255,255,.2);margin:0 .6%;}

.hdr-tabs{display:flex;gap:.5%;align-items:center;}
.hdr-tab{
  font-size:.65em;letter-spacing:.15em;color:#5a6a7a;
  padding:.3em .8em;cursor:pointer;transition:color .2s;
  border-bottom:2px solid transparent;
}
.hdr-tab.active,.hdr-tab:hover{color:#e8eaf0;border-bottom-color:#c0252a;}

.hdr-right{display:flex;align-items:center;gap:1%;}
.back-btn{
  font-family:'Orbitron',sans-serif;
  font-size:.65em;font-weight:700;letter-spacing:.18em;
  background:#c0252a;color:#fff;
  padding:.5em 1.2em;border-radius:3px;border:none;cursor:pointer;
  display:flex;align-items:center;gap:.5em;
  box-shadow:0 0 12px rgba(192,37,42,.4);
  transition:background .2s;
}
.back-btn:hover{background:#d42d32;}
.back-btn svg{width:1em;height:1em;}

/* ── MAIN CONTENT AREA ───────────────────────────────────────── */
.main-area{
  display:grid;
  grid-template-columns:16% 52% 32%;
  position:relative;z-index:10;
  overflow:hidden;
}

/* ── SIDEBAR ─────────────────────────────────────────────────── */
.sidebar{
  background:#10121a;
  border-right:1px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;
  padding:4% 6% 4%;
  gap:4%;
  overflow:hidden;
}
.cat-btn{
  background:transparent;
  border:1px solid rgba(255,255,255,.12);
  border-radius:2px;
  color:#8a9aaa;
  font-family:'Rajdhani',sans-serif;
  font-size:.75em;font-weight:600;letter-spacing:.15em;
  padding:.55em .8em;
  cursor:pointer;text-align:left;
  transition:all .2s;position:relative;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cat-btn::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:0;
  background:#c0252a;transition:width .2s;
}
.cat-btn.active,
.cat-btn:hover{color:#f0f2f5;border-color:rgba(255,255,255,.25);}
.cat-btn.active::before{width:3px;}
.cat-btn.active{
  background:rgba(192,37,42,.08);
  border-color:rgba(192,37,42,.35);
  padding-left:calc(.8em + 4px);
}

/* ── CENTER DISPLAY ──────────────────────────────────────────── */
.display-area{
  position:relative;
  background:
    radial-gradient(ellipse at 50% 80%, rgba(30,35,50,.8) 0%, transparent 70%),
    linear-gradient(180deg,#0a0b11 0%,#0e1018 60%,#080910 100%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
}

/* floor reflection line */
.display-area::after{
  content:'';position:absolute;bottom:22%;left:10%;right:10%;
  height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
}

/* floor radial glow */
.floor-glow{
  position:absolute;bottom:16%;left:50%;transform:translateX(-50%);
  width:60%;height:8%;
  border-radius:50%;
  background:radial-gradient(ellipse,var(--accent-glow,rgba(192,37,42,.15)) 0%,transparent 70%);
  pointer-events:none;
}

.drone-svg-wrap{
  width:68%;max-height:72%;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 0 20px var(--accent-glow,rgba(192,37,42,.3)));
  transition:filter .4s;
}
.drone-svg-wrap svg{width:100%;height:auto;}

.rarity-tag{
  position:absolute;bottom:24%;
  background:var(--rarity-bg,#1e3a8a);
  border:1px solid var(--rarity-border,#2563eb);
  color:var(--rarity-color,#60a5fa);
  font-family:'Orbitron',sans-serif;
  font-size:.55em;font-weight:700;letter-spacing:.25em;
  padding:.35em 1.2em;border-radius:2px;
  display:flex;align-items:center;gap:.6em;
}
.rarity-icon{width:1.2em;height:1.2em;opacity:.8;}

.class-chip{
  position:absolute;top:4%;left:4%;
  font-size:.5em;letter-spacing:.2em;
  color:rgba(255,255,255,.35);
  font-family:'Share Tech Mono',monospace;
}

/* ── STATS PANEL ─────────────────────────────────────────────── */
.stats-panel{
  background:#12141c;
  border-left:1px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;
  padding:3% 5%;
  gap:0;overflow:hidden;
}

.drone-name-row{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:3%;
}
.drone-name-big{
  font-family:'Orbitron',sans-serif;
  font-size:1em;font-weight:900;
  color:#eef0f5;letter-spacing:.08em;
  line-height:1.1;
}
.name-badges{display:flex;gap:4%;margin-top:4%;}
.name-badge{
  font-family:'Share Tech Mono',monospace;
  font-size:.42em;letter-spacing:.12em;
  padding:.25em .6em;border-radius:2px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);color:#8a9aaa;
  display:flex;align-items:center;gap:.4em;
}
.name-badge.highlight{
  background:rgba(192,37,42,.1);
  border-color:rgba(192,37,42,.35);
  color:#e07070;
}

.threat-block{
  text-align:right;
}
.threat-num{
  font-family:'Orbitron',sans-serif;
  font-size:1.6em;font-weight:900;
  color:var(--accent,#c0252a);
  text-shadow:0 0 10px var(--accent-glow,rgba(192,37,42,.5));
  line-height:1;
}
.threat-lbl{
  font-size:.42em;letter-spacing:.15em;color:#4a5a6a;
  font-family:'Share Tech Mono',monospace;
}

/* stats grid: 2 columns, 3 rows */
.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2% 4%;
  margin-bottom:4%;
  padding-bottom:4%;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.stat-item{
  display:flex;align-items:center;gap:6%;
  padding:2.5% 0;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.stat-icon{
  width:1.6em;height:1.6em;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#4a6070;font-size:.8em;
}
.stat-icon svg{width:100%;height:100%;}
.stat-info{flex:1;min-width:0;}
.stat-lbl{
  font-family:'Share Tech Mono',monospace;
  font-size:.37em;letter-spacing:.15em;color:#4a6070;
  display:block;
}
.stat-val{
  font-family:'Rajdhani',sans-serif;
  font-size:.75em;font-weight:700;letter-spacing:.05em;color:#d0d8e0;
  display:block;white-space:nowrap;
}
.stat-num-big{
  font-family:'Orbitron',sans-serif;
  font-size:.8em;font-weight:700;color:#eef0f5;flex-shrink:0;
  text-align:right;min-width:3ch;
}

/* action buttons */
.action-row{
  display:grid;grid-template-columns:1fr 1fr;gap:4%;
  margin-bottom:3%;
}
.btn{
  border:none;border-radius:2px;cursor:pointer;
  font-family:'Rajdhani',sans-serif;font-size:.65em;
  font-weight:700;letter-spacing:.2em;padding:.6em;
  transition:all .2s;
}
.btn-ghost{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);color:#8a9aaa;
}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:#d0d8e0;}
.btn-red{background:#c0252a;color:#fff;box-shadow:0 0 10px rgba(192,37,42,.35);}
.btn-red:hover{background:#d42d32;}

.upgrade-row{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:2px;padding:.5em .8em;margin-bottom:3%;cursor:pointer;
  transition:background .2s;
}
.upgrade-row:hover{background:rgba(255,255,255,.07);}
.upgrade-left{display:flex;align-items:center;gap:.6em;}
.upgrade-icon{color:#ffd060;font-size:.8em;}
.upgrade-text{font-size:.65em;letter-spacing:.2em;color:#c0c8d0;font-weight:700;}
.upgrade-divider{color:rgba(255,255,255,.15);font-size:.65em;}
.upgrade-cost{font-size:.65em;color:#ffd060;font-weight:700;letter-spacing:.1em;
  display:flex;align-items:center;gap:.4em;}

/* description */
.desc-title{
  font-family:'Share Tech Mono',monospace;
  font-size:.42em;letter-spacing:.2em;color:#4a6070;margin-bottom:2%;
}
.desc-text{
  font-size:.58em;line-height:1.55;color:#5a7080;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;line-clamp:4;
  -webkit-box-orient:vertical;
}

/* ── BOTTOM CAROUSEL ─────────────────────────────────────────── */
.carousel{
  background:#0c0e16;
  border-top:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;
  padding:0 1%;
  gap:.8%;
  overflow-x:auto;overflow-y:hidden;
  z-index:10;position:relative;
  scrollbar-width:none;
}
.carousel::-webkit-scrollbar{display:none;}

.drone-card{
  flex-shrink:0;
  width:calc(14% - .4%);
  height:82%;
  border-radius:3px;border:1px solid rgba(255,255,255,.08);
  background:#13151f;
  display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;
  padding:4% 5% 3%;
  cursor:pointer;transition:all .2s;
  position:relative;overflow:hidden;
}
.drone-card:hover{border-color:rgba(255,255,255,.2);background:#1a1d2a;}
.drone-card.selected{
  background:#1c1f2e;
  border-color:rgba(192,37,42,.6);
  box-shadow:0 0 0 1px rgba(192,37,42,.2),inset 0 0 12px rgba(192,37,42,.05);
}
.drone-card.selected::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#c0252a,transparent);
}
.drone-card.dimmed{opacity:.45;}

.card-mini-svg{width:80%;height:50%;display:flex;align-items:center;justify-content:center;}
.card-mini-svg svg{width:100%;height:auto;}

.card-name{
  font-size:.45em;font-weight:700;letter-spacing:.1em;
  color:#8a9aaa;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;
}
.drone-card.selected .card-name{color:#e0e8f0;}

.card-flag{font-size:.7em;line-height:1;}

.buy-btn{
  background:#c0252a;color:#fff;border:none;border-radius:2px;
  font-family:'Rajdhani',sans-serif;font-size:.38em;
  font-weight:700;letter-spacing:.15em;
  padding:.3em .8em;cursor:pointer;width:100%;
  transition:background .2s;
}
.buy-btn:hover{background:#d42d32;}

/* ── TRANSITIONS ─────────────────────────────────────────────── */
.display-area,.stats-panel,.sidebar{transition:background .3s;}
.drone-svg-wrap{transition:opacity .25s,transform .25s;}
.drone-svg-wrap.fade{opacity:0;transform:scale(.96);}

/* ── REAL DRONE IMAGES ────────────────────────────────────────── */
.drone-img{
  width:100%;height:100%;
  object-fit:contain;max-height:100%;
  border-radius:4px;
  filter:contrast(1.05) saturate(0.88) brightness(0.92);
  transition:filter .3s;
}
.drone-svg-wrap:hover .drone-img{filter:contrast(1.1) saturate(1.0) brightness(1.0);}
.card-mini-img{
  width:90%;height:58%;object-fit:contain;
  filter:saturate(0.7) brightness(0.75);
  border-radius:2px;
}
.drone-card.selected .card-mini-img{filter:saturate(0.95) brightness(0.9);}
</style>
</head>
<body>
<div class="screen" id="screen">

<!-- ═══ HEADER ════════════════════════════════════════════════ -->
<header>
  <div class="hdr-brand">
    <div class="hdr-icon">D</div>
    <span class="hdr-sep">|</span>
    <span class="hdr-title">ARMOURY</span>
  </div>
  <div class="hdr-tabs">
    <span class="hdr-tab active">DRONES</span>
    <span class="hdr-tab">WEAPONS</span>
    <span class="hdr-tab">INTEL</span>
  </div>
  <div class="hdr-right">
    <button class="back-btn">
      BACK TO LOBBY
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0l8 8-8 8-1.4-1.4 5.6-5.6H0V7h12.2L6.6 1.4z"/></svg>
    </button>
  </div>
</header>

<!-- ═══ MAIN ══════════════════════════════════════════════════ -->
<div class="main-area">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <button class="cat-btn active" data-cat="ALL">ALL DRONES</button>
    <button class="cat-btn" data-cat="CONSUMABLE">CONSUMABLE</button>
    <button class="cat-btn" data-cat="REUSABLE">REUSABLE</button>
    <button class="cat-btn" data-cat="NANO">NANO CLASS</button>
    <button class="cat-btn" data-cat="TACTICAL">TACTICAL UAV</button>
    <button class="cat-btn" data-cat="MALE">MALE CLASS</button>
  </aside>

  <!-- CENTER DISPLAY -->
  <div class="display-area" id="displayArea">
    <span class="class-chip" id="classChip">NANO / MICRO</span>
    <div class="floor-glow" id="floorGlow"></div>
    <div class="drone-svg-wrap" id="droneSvgWrap"></div>
    <div class="rarity-tag" id="rarityTag">
      <svg class="rarity-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0l2 5h5l-4 3 1.5 5L8 10l-4.5 3L5 8 1 5h5z"/></svg>
      <span id="rarityText">RARE</span>
    </div>
  </div>

  <!-- STATS PANEL -->
  <div class="stats-panel">
    <div class="drone-name-row">
      <div>
        <div class="drone-name-big" id="droneName">FPV KAMIKAZE</div>
        <div class="name-badges">
          <span class="name-badge" id="badge1">🇺🇦 &nbsp;UKRAINE</span>
          <span class="name-badge highlight" id="badge2">MULTI-ROTOR</span>
        </div>
      </div>
      <div class="threat-block">
        <div class="threat-num" id="threatNum">72</div>
        <div class="threat-lbl">THREAT</div>
      </div>
    </div>

    <div class="stats-grid" id="statsGrid">
      <!-- injected by JS -->
    </div>

    <div class="action-row">
      <button class="btn btn-ghost">ANALYZE</button>
      <button class="btn btn-red">DEPLOY</button>
    </div>

    <div class="upgrade-row">
      <div class="upgrade-left">
        <span class="upgrade-icon">⬆</span>
        <span class="upgrade-text">UPGRADE</span>
        <span class="upgrade-divider">|</span>
      </div>
      <div class="upgrade-cost" id="upgradeCost">◎ &nbsp;$500</div>
    </div>

    <div class="desc-title">DESCRIPTION</div>
    <div class="desc-text" id="descText">Loading...</div>
  </div>
</div>

<!-- ═══ CAROUSEL ══════════════════════════════════════════════ -->
<div class="carousel" id="carousel">
  <!-- injected by JS -->
</div>

</div><!-- /screen -->

<script>
/* ══ DRONE DATA ═══════════════════════════════════════════════════════ */
const DRONES = [
  {

      <circle cx="222" cy="58"  r="14" fill="#5a6a7a" stroke="#99aabb" stroke-width="2"/>

      <!-- rotor discs (blurred) -->

      <ellipse cx="222" cy="58"  rx="28" ry="10" fill="none" stroke="rgba(180,200,220,0.45)" stroke-width="2" transform="rotate(45 222 58)"/>
      <ellipse cx="58"  cy="222" rx="28" ry="10" fill="none" stroke="rgba(180,200,220,0.45)" stroke-width="2" transform="rotate(45 58 222)"/>

      <!-- body -->
      <rect x="116" y="116" width="48" height="48" rx="5" fill="#4a5566" stroke="#8899aa" stroke-width="2"/>

      <circle cx="140" cy="140" r="9" fill="#111" stroke="#e04040" stroke-width="1.5"/>

      <line x1="140" y1="116" x2="140" y2="90" stroke="#8899aa" stroke-width="2"/>
      <circle cx="140" cy="88" r="3" fill="#e04040"/>
    </svg>`,
    miniSvg:`<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <line x1="40" y1="40" x2="18" y2="18" stroke="#8899aa" stroke-width="4" stroke-linecap="round"/>

      <line x1="40" y1="40" x2="18" y2="62" stroke="#8899aa" stroke-width="4" stroke-linecap="round"/>
      <line x1="40" y1="40" x2="62" y2="62" stroke="#8899aa" stroke-width="4" stroke-linecap="round"/>

      <!-- "HALTED" text -->
      <text x="170" y="125" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(255,80,80,0.4)" letter-spacing="3">HALTED</text>
    </svg>`,
    miniSvg:`<svg viewBox="0 0 96 60" xmlns="http://www.w3.org/2000/svg">
      <path d="M44 28 L2 36 L44 40 Z" fill="#3a3838" opacity="0.8"/>
      <path d="M52 28 L94 36 L52 40 Z" fill="#3a3838" opacity="0.8"/>
      <ellipse cx="48" cy="34" rx="6" ry="20" fill="#5a5858" opacity="0.8"/>
      <line x1="32" y1="24" x2="64" y2="50" stroke="#ff4444" stroke-width="2" opacity="0.6"/>
      <line x1="64" y1="24" x2="32" y2="50" stroke="#ff4444" stroke-width="2" opacity="0.6"/>
    </svg>`,
  },
];

/* ── IMAGE PATHS ────────────────────────────────────────────────────── */
const IMGS = {
  fpv:     'drone-images/fpv.png',
  shahed:  'drone-images/shahed.jpg',
  nagastra:'drone-images/nagastra.jpg',
  switch:  'drone-images/switch.png',
  mq9b:    'drone-images/mq9b.jpg',
  vbat:    'drone-images/vbat.jpg',
  tapas:   'drone-images/tapas.jpg',
};

/* ── ICONS ──────────────────────────────────────────────────────────── */
const ICONS = {
  range:`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3"/><line x1="8" y1="2" x2="8" y2="0"/><line x1="8" y1="14" x2="8" y2="16"/><line x1="2" y1="8" x2="0" y2="8"/><line x1="14" y1="8" x2="16" y2="8"/></svg>`,
  speed:`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 10 A7 7 0 0 1 14 10"/><line x1="8" y1="10" x2="12" y2="5"/><circle cx="8" cy="10" r="1.5" fill="currentColor"/></svg>`,
  alt:`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="8,2 8,14"/><polyline points="4,5 8,2 12,5"/><line x1="4" y1="14" x2="12" y2="14"/></svg>`,
  time:`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><polyline points="8,4 8,8 11,10"/></svg>`,
  pay:`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="9" width="10" height="5" rx="1"/><path d="M5 9V6a3 3 0 016 0v3"/></svg>`,
  cost:`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="8,1 10,6 15,6 11,9.5 12.5,15 8,12 3.5,15 5,9.5 1,6 6,6"/></svg>`,
};

/* ── STATE ──────────────────────────────────────────────────────────── */
let currentDrone = DRONES[0];
let currentCat = 'ALL';

/* ── RENDER ─────────────────────────────────────────────────────────── */
function setAccent(drone){
  document.documentElement.style.setProperty('--accent', drone.accentHex);
  document.documentElement.style.setProperty('--accent-glow', drone.accentGlow);
  document.getElementById('floorGlow').style.background =
    `radial-gradient(ellipse,${drone.accentGlow} 0%,transparent 70%)`;
}

function renderStats(drone){
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = drone.stats.map(s=>`
    <div class="stat-item">
      <div class="stat-icon" style="color:${drone.accentHex}">${ICONS[s.icon]||ICONS.cost}</div>
      <div class="stat-info">
        <span class="stat-lbl">${s.lbl}</span>
        <span class="stat-val">${s.val}</span>
      </div>
      <div class="stat-num-big">${s.num}</div>
    </div>`).join('');
}

function renderDrone(drone, animate=true){
  currentDrone = drone;

  // accent
  setAccent(drone);

  // Image
  const wrap = document.getElementById('droneSvgWrap');
  if(animate){ wrap.classList.add('fade'); }
  setTimeout(()=>{
    wrap.innerHTML = `<img class="drone-img" src="${IMGS[drone.id]}" alt="${drone.name}"/>`;
    if(animate) wrap.classList.remove('fade');
  }, animate ? 220 : 0);

  // rarity
  const rt = document.getElementById('rarityTag');
  rt.style.background = drone.rarityBg;
  rt.style.borderColor = drone.rarityBorder;
  rt.style.color = drone.rarityColor;
  document.getElementById('rarityText').textContent = drone.rarity;

  // class chip
  document.getElementById('classChip').textContent =
    drone.categories.join(' / ');

  // name + badges
  document.getElementById('droneName').textContent = drone.name;
  document.getElementById('badge1').innerHTML = drone.country;
  document.getElementById('badge2').textContent = drone.airframe;

  // threat
  const tn = document.getElementById('threatNum');
  tn.textContent = drone.threat;
  tn.style.color = drone.accentHex;
  tn.style.textShadow = `0 0 10px ${drone.accentGlow}`;

  // stats
  renderStats(drone);

  // cost
  document.getElementById('upgradeCost').innerHTML = `◎ &nbsp;${drone.cost}`;

  // desc
  document.getElementById('descText').textContent = drone.desc;

  // carousel highlight
  document.querySelectorAll('.drone-card').forEach(c=>{
    c.classList.toggle('selected', c.dataset.id === drone.id);
  });
}

function renderCarousel(cat){
  const carousel = document.getElementById('carousel');
  carousel.innerHTML = DRONES.map(d => {
    const inCat = cat === 'ALL' || d.categories.includes(cat);
    return `<div class="drone-card ${inCat?'':'dimmed'}" data-id="${d.id}">
      <img class="card-mini-img" src="${IMGS[d.id]}" alt="${d.name}"/>
      <span class="card-flag">${d.country.split(' ')[0]}</span>
      <span class="card-name">${d.name}</span>
      ${!inCat
        ? `<button class="buy-btn" style="background:#2a3040;color:#5a6a7a;cursor:default">LOCKED</button>`
        : `<button class="buy-btn" style="background:${d.id===currentDrone.id?'#2a3040':'#c0252a'};
             color:${d.id===currentDrone.id?'#8a9aaa':'#fff'}">${d.id===currentDrone.id?'SELECTED':'SELECT'}</button>`}
    </div>`;
  }).join('');

  // highlight selected
  document.querySelectorAll('.drone-card').forEach(c=>{
    c.classList.toggle('selected', c.dataset.id === currentDrone.id);
    c.addEventListener('click', ()=>{
      const drone = DRONES.find(d=>d.id===c.dataset.id);
      if(drone) renderDrone(drone);
      renderCarousel(currentCat);
    });
  });
}

/* ── CATEGORY BUTTONS ────────────────────────────────────────────────── */
document.querySelectorAll('.cat-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    renderCarousel(currentCat);
  });
});

/* ── INIT ────────────────────────────────────────────────────────────── */
renderDrone(DRONES[0], false);
renderCarousel('ALL');
</script>
</body>
</html>
